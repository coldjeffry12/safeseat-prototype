name: Build unsigned research prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and run simulated tests
        run: ./scripts/build.ps1 -SkipUiSmoke
      - name: Check source and manifest
        run: ./scripts/safety-scan.ps1
      - name: Check package privacy
        run: ./tests/SafeSeat.PackageTests/Verify-Package.ps1
      - name: Package unsigned release
        run: ./scripts/package.ps1 -SkipBuild -SkipGuiSmoke
      - name: Upload unsigned packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safeseat-unsigned-${{ github.sha }}
          path: |
            .packages/SafeSeat-source.zip
            .packages/SafeSeat-demo.zip
            .packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
